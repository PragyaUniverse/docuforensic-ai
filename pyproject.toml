[project]
name = "docuforensic-ai"
version = "0.1.0"
description = "Evidence-driven document forensics and contextual intelligence"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "data"]
