[project]
name = "docuforensic-ai"
version = "0.1.0"
description = "Evidence-driven document forensics and contextual intelligence"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
# Real errors, import order and modern syntax. Broad `except` stays allowed on purpose: a failing
# detector must degrade its stage, never crash a case.
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP042"]  # str-and-Enum classes serialize as plain strings in the API

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # these put the repo root on sys.path before importing project modules
"pipeline/extract.py" = ["E741"]  # one-letter aliases keep the label table readable
"tests/*" = ["E731"]
