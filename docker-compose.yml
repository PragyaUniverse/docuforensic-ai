# One container: the API also serves the website. Open http://localhost:7860
# Deploying to a free host is described in docs/DEPLOY.md.
services:
  app:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    environment:
      # Reach a local Ollama running on the host, if there is one.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_CHAIN: ${LLM_CHAIN:-groq,gemini,openrouter,ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app/var

volumes:
  app-data:
